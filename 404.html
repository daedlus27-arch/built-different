  <script>
    // GitHub Pages shows this page for any wrong address, even deep ones like
    // /built-different/a/b. Point its links back at the site folder there.
    // (If you rename the GitHub repo, change "/built-different/" to match.)
    if (/\.github\.io$/i.test(location.hostname) && location.pathname.split("/").length > 3) {
      document.write('<base href="/built-different/">');
    }
  </script>
